services:
  mongodb:
   image: mongo:7

   container_name: bike-rental-mongodb
   restart: unless-stopped
   ports:
      - "27017:27017"
   volumes:
      - mongo_data:/data/db
  
  redis:
    image: redis:7-alpine
    container_name: bike-rental-redis
    restart: unless-stopped
    # ports:
    #   - "6380:6379"
    volumes:
      - redis_data:/data
  backend:
    build:
      context: ./server
    container_name: bike-rental-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Other variables (MONGO_URI, JWT_SECRET, CLIENT_URL, etc.) 
      # are safely injected from the ./server/.env file!
    depends_on:
      - mongodb
      - redis
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: bike-rental-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mongo_data:
  redis_data: