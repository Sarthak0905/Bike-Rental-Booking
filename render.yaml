services:
  - type: web
    name: bike-rental-backend
    env: node
    region: singapore # You can change this based on your preference (e.g., oregon, frankfurt)
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Render will prompt you to enter this securely
      - key: CLIENT_URL
        value: https://bike-rental-booking.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # If you want to enable Redis, add REDIS_URL here, otherwise it will gracefully degrade.
      # - key: REDIS_URL
      #   sync: false
